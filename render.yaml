databases:
  - name: atlas-postgres
    databaseName: atlas
    user: atlas
    plan: free
    ipAllowList: []

services:
  - type: web
    name: atlas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: ATLAS_DATABASE_URL
        fromDatabase:
          name: atlas-postgres
          property: connectionString
      - key: ATLAS_ENVIRONMENT
        value: production
      - key: ATLAS_COOKIE_SECURE
        value: "true"
      - key: ATLAS_BOOTSTRAP_TOKEN
        generateValue: true
      - key: ATLAS_ALLOWED_ORIGINS
        sync: false
      - key: ATLAS_MARKET_DATA_DIR
        value: /data
      - key: ATLAS_MARKET_DATA_SOURCE
        sync: false
      - key: ATLAS_MARKET_DATA_IS_SYNTHETIC
        sync: false

  - type: web
    name: atlas-ui
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: ATLAS_BACKEND_URL
        sync: false
